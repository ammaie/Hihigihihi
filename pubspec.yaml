name: science_world
description: عالم العلوم | Science World - تعليمي لطلاب المنهاج السوري
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.5.6
  dio: ^5.0.0
  path_provider: ^2.0.15
  pdfx: ^3.0.0
  open_file: ^3.4.0
  url_launcher: ^6.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf